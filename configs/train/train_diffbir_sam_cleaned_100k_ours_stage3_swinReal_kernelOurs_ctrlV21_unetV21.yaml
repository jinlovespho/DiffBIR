train_batch_transform:
  target: diffbir.dataset.pho_batch_transform.RealESRGANBatchTransform
  params:
    use_sharpener: true
    queue_size: 48

    # === First degradation process ===
    resize_prob: [0.1, 0.8, 0.1]        # was [0.2, 0.7, 0.1] → more likely to keep original size
    resize_range: [0.8, 1.1]            # was [0.15, 1.5] → avoid extreme up/downsampling
    gaussian_noise_prob: 0.2           # was 0.5 → less likely to add Gaussian noise
    noise_range: [1, 10]               # was [1, 30] → reduced max noise strength
    poisson_scale_range: [0.02, 1]     # was [0.05, 3] → milder Poisson noise
    gray_noise_prob: 0.1               # was 0.4 → rare grayscale noise
    jpeg_range: [70, 95]               # was [30, 95] → avoids strong JPEG compression artifacts

    # === Second degradation process ===
    stage2_scale: 4
    second_blur_prob: 0.4              # was 0.8 → much lower second blur chance
    resize_prob2: [0.2, 0.6, 0.2]      # was [0.3, 0.4, 0.3] → slight preference to preserve resolution
    resize_range2: [0.9, 1.05]         # was [0.3, 1.2] → very limited resizing
    gaussian_noise_prob2: 0.2          # was 0.5
    noise_range2: [1, 8]               # was [1, 25]
    poisson_scale_range2: [0.02, 0.5]  # was [0.05, 2.5]
    gray_noise_prob2: 0.1              # was 0.4
    jpeg_range2: [70, 95]              # was [30, 95]

val_batch_transform:
  target: diffbir.dataset.pho_batch_transform.RealESRGANBatchTransform
  params:
    use_sharpener: true
    queue_size: 96

    # === First degradation process ===
    resize_prob: [0.1, 0.8, 0.1]        # was [0.2, 0.7, 0.1]
    resize_range: [0.8, 1.1]            # was [0.15, 1.5]
    gaussian_noise_prob: 0.2           # was 0.5
    noise_range: [1, 10]               # was [1, 30]
    poisson_scale_range: [0.02, 1]     # was [0.05, 3]
    gray_noise_prob: 0.1               # was 0.4
    jpeg_range: [70, 95]               # was [30, 95]

    # === Second degradation process ===
    stage2_scale: 4
    second_blur_prob: 0.4              # was 0.8
    resize_prob2: [0.2, 0.6, 0.2]      # was [0.3, 0.4, 0.3]
    resize_range2: [0.9, 1.05]         # was [0.3, 1.2]
    gaussian_noise_prob2: 0.2          # was 0.5
    noise_range2: [1, 8]               # was [1, 25]
    poisson_scale_range2: [0.02, 0.5]  # was [0.05, 2.5]
    gray_noise_prob2: 0.1              # was 0.4
    jpeg_range2: [70, 95]              # was [30, 95]




# training args
train:
  # pretrained sd v2.1 path
  # sd_path: ./weights/v2-1_512-ema-pruned.ckpt           -> unetV2
  # sd_path: ./weights/sd2.1-base-zsnr-laionaes5.ckpt     -> unetV21
  sd_path: ./weights/sd2.1-base-zsnr-laionaes5.ckpt       
  # stage 1 swinir path.
  # swinir_path: ./weights/codeformer_swinir.ckpt         -> swinCode
  # swinir_path: ./weights/realesrgan_s4_swinir_100k.pth  -> swinReal
  swinir_path: ./weights/realesrgan_s4_swinir_100k.pth
  # resume: ./weights/v2.pth                              -> ctrlV2
  # resume: ./weights/DiffBIR_v2.1.pt                     -> ctrlV21
  resume: ./weights/DiffBIR_v2.1.pt
  noise_aug_timestep: 0
  num_workers: 4
  train_steps: 50000  # 100,000 for 30 epoch, 50,000 for 15 epoch, 10,000 for 3 epoch, 2,500 for 0.75epoch
  ckpt_every: 10000
  log_loss_every: 50
  log_image_every: 500
  batch_size: 32
  log_num_train_img: 32
  learning_rate: 1e-5
  # experiment save directory path
  exp_dir: ./model_ckpts/sam_cleaned_100k/stage3



val:
  num_workers: 4
  batch_size: 10
  log_num_val_img: 10
  log_image_every: 500



